services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricewatch}
      POSTGRES_DB: pricewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # Context is the repo root, not ./backend — both this image and
    # web's need read access to the shared locales/ translation source
    # at build/copy time (see backend/Dockerfile and web/Dockerfile).
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback-only — Caddy is the sole public entrypoint (see the
      # caddy service below and PLAN.md § Panel: "the browser never talks
      # to Fiber directly"). Still reachable at localhost:8080 for local
      # debugging on the host itself.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://pricewatch:${POSTGRES_PASSWORD:-pricewatch}@postgres:5432/pricewatch?sslmode=disable
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      # Loopback-only, same reasoning as app's port above — Caddy fronts
      # this publicly.
      - "127.0.0.1:3000:3000"
    depends_on:
      - app
    environment:
      # Internal docker-network hostname — the browser only ever talks to
      # `web`; Next.js server-side code is the only thing that calls
      # Fiber. See web/lib/api.ts.
      API_INTERNAL_URL: http://app:8080
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Nightly pg_dump — see scripts/backup.sh. Deliberately not a
  # third-party backup image or an in-container cron daemon; PLAN.md's
  # whole "single VM, single user" philosophy (no Redis, no Loki) applies
  # here too — one script, one job, easy to read end to end.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - pgbackups:/backups
    environment:
      PGHOST: postgres
      PGUSER: pricewatch
      PGPASSWORD: ${POSTGRES_PASSWORD:-pricewatch}
      PGDATABASE: pricewatch
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  pgbackups:
  caddy_data:
  caddy_config:
