services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pricewatch}
      POSTGRES_DB: pricewatch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricewatch"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://pricewatch:${POSTGRES_PASSWORD:-pricewatch}@postgres:5432/pricewatch?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - app
    environment:
      # Internal docker-network hostname — the browser only ever talks to
      # `web`; Next.js server-side code is the only thing that calls
      # Fiber. See web/lib/api.ts.
      API_INTERNAL_URL: http://app:8080
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
